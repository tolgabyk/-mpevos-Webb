name: Deploy Check

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install --prefix client
      - run: npm run build --prefix client
      - name: Verify departman build
        run: |
          grep -q "31 Departman" client/dist/assets/*.js
          grep -q "departman-v2" client/public/version.txt
          echo "Build OK — Vercel otomatik deploy bekleniyor"
